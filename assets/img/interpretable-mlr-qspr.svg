<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Interpretable QSPR with Multiple Linear Regression</title>
  <desc id="desc">Educational infographic showing standardized coefficients, Pearson correlation, KDE chemical space, and molecular structures.</desc>
  <rect width="1536" height="1024" rx="42" fill="#f6f9fc"/>
  <rect x="36" y="34" width="1464" height="180" rx="34" fill="#173f76"/>
  <text x="86" y="108" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Interpretable QSPR</text>
  <text x="86" y="162" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#dbeafe">with Multiple Linear Regression</text>
  <text x="980" y="113" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#dbeafe">Descriptors → Statistics → Chemistry</text>
  <text x="980" y="153" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#cbd5e1">12 molecular descriptors · ESOL solubility</text>

  <rect x="54" y="252" width="445" height="570" rx="28" fill="#ffffff" stroke="#bfd4eb" stroke-width="3"/>
  <text x="86" y="306" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#173f76">1. Linear interpretation</text>
  <text x="86" y="347" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">Standardized coefficients reveal conditional</text>
  <text x="86" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">linear contributions in the MLR model.</text>
  <line x1="120" y1="720" x2="120" y2="425" stroke="#64748b" stroke-width="3"/>
  <line x1="120" y1="575" x2="440" y2="575" stroke="#64748b" stroke-width="3"/>
