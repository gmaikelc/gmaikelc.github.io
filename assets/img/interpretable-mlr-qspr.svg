  <text x="1074" y="778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#c85e00">KDE → region selection → molecules</text>

  <rect x="54" y="858" width="1427" height="112" rx="24" fill="#eaf1f8"/>
  <text x="90" y="906" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#173f76">Key concepts</text>
  <text x="90" y="945" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Standardized MLR coefficients  ·  Pearson correlation  ·  Multicollinearity  ·  KDE density  ·  Molecular structure interpretation</text>
