  <text x="621" y="773" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#147a55">Pearson r ≠ conditional MLR effect</text>

  <rect x="1036" y="252" width="445" height="570" rx="28" fill="#ffffff" stroke="#f2d4b3" stroke-width="3"/>
