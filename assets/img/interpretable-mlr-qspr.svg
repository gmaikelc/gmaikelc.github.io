  <text x="1068" y="347" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">KDE density maps identify populated regions</text>
  <text x="1068" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">and connect data points to real molecules.</text>
