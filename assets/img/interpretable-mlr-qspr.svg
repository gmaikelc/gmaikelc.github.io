  <rect x="120" y="670" width="215" height="35" rx="6" fill="#e67e22"/>
  <text x="86" y="468" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">TPSA</text>
  <text x="86" y="518" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">HBA</text>
  <text x="70" y="638" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">MolWt</text>
  <text x="57" y="688" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Aromatic</text>
  <text x="86" y="775" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#173f76">Positive ↔ Negative effects</text>

  <rect x="545" y="252" width="445" height="570" rx="28" fill="#ffffff" stroke="#c7e7d7" stroke-width="3"/>
  <text x="578" y="306" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#147a55">2. Correlation context</text>
  <text x="578" y="347" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">Compare Pearson r with standardized MLR</text>
  <text x="578" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">coefficients to expose multicollinearity.</text>
  <line x1="606" y1="710" x2="606" y2="432" stroke="#64748b" stroke-width="3"/>
  <line x1="606" y1="710" x2="948" y2="710" stroke="#64748b" stroke-width="3"/>
